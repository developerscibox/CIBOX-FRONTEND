# Tarea 2.13 del plan de seguridad. Los tests son la puerta dura. La auditoría
# de dependencias se reporta pero no bloquea: el backend arrastra una alerta
# alta conocida (nodemailer, salto mayor pendiente para staging) y la tienda
# recibe las herramientas de build de Expo como dependencias de producción, así
# que `--omit=dev` no las filtra. Bloquear con eso dejaba el CI rojo siempre,
# y un CI siempre rojo es un CI que nadie mira.
name: Seguridad y tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        proyecto: [tienda, bodega]
    defaults:
      run:
        working-directory: ${{{{ matrix.proyecto }}}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{{{ matrix.proyecto }}}}/package-lock.json
      - run: npm ci
      - name: Auditoría de dependencias (informativa)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
